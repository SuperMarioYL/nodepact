name: ci

on: [push, pull_request]

jobs:
  test:
    name: typecheck, build and test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The suite is node:test: pure modules, a vm-backed page shim for the fingerprint
      # re-location, the CLI as a child process, and the MCP tools over stdio. None of it needs
      # a browser: the CDP paths are driven through fakes and a closed port.
      - name: Test
        run: npm test
