name: release

# A tag push is the whole trigger: it builds the npm tarball into dist/, attaches it (with
# checksums) to the GitHub Release, and — only when the repo variable NPM_PUBLISH is "true" —
# publishes to npm. Nothing here needs a browser, so a release never depends on the demo.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  package:
    name: package and attach the release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version v$version" >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build and pack into dist/
        run: |
          npm run build
          mkdir -p dist
          npm pack --pack-destination dist
          # A stable name, so /releases/latest/download/nodepact.tgz always resolves.
          cp dist/nodepact-*.tgz dist/nodepact.tgz
          cd dist && sha256sum *.tgz > checksums.txt && cat checksums.txt

      - name: Upload the workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nodepact-dist
          path: dist/*
          if-no-files-found: error

      # The release asset is the deliverable: a tag push must produce a downloadable tarball,
      # not just a workflow artifact that expires.
      - name: Attach dist/ to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  npm:
    name: publish to npm
    needs: package
    # Opt-in on purpose: a fresh repo has no NPM_TOKEN and no claim on the package name, and an
    # always-on publish job would fail the first release. Set the repo variable NPM_PUBLISH=true
    # and the NPM_TOKEN secret when you actually want to ship to npm.
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      - uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          access: public
