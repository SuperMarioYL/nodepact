  <text x="600" y="326" text-anchor="middle" font-size="12.5" class="mono" fill="#5656e6">node-scoped diff</text>
  <text x="600" y="346" text-anchor="middle" font-size="12.5" class="mono" fill="#8d57bd">no model in the verdict</text>

